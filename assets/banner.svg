<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="t d">
  <title id="t">Ayush Fulsundar, data engineer</title>
  <desc id="d">Animated pipeline showing sources flowing through Airflow, Snowflake, LangGraph and FastAPI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="899" height="289" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="899" height="289" rx="18" fill="url(#grid)"/>

  <!-- status chip (top right) -->
  <rect x="620" y="26" width="240" height="30" rx="15" fill="#0d1117" stroke="#30363d"/>
  <circle cx="640" cy="41" r="4" fill="#3fb950">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="654" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">Boston, MA · Northeastern ’26</text>

  <!-- name + role -->
  <text x="40" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">Ayush Fulsundar</text>
  <text x="40" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Data Engineer · Agentic AI Systems</text>

  <!-- cycling terminal line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3fb950">
    <text x="40" y="160" opacity="1">$ ingesting 100K+ records a day
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="160" opacity="0">$ routing LLMs with fallbacks and budgets
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="160" opacity="0">$ shipping agents behind typed APIs
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="40" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e7681">// my stack, as a pipeline</text>

  <!-- flow line under the nodes -->
  <line x1="100" y1="224" x2="800" y2="224" stroke="#30363d" stroke-width="2"/>
  <line x1="100" y1="224" x2="800" y2="224" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- data packets (hidden behind the nodes while they pass through) -->
  <g filter="url(#glow)">
    <circle cy="224" r="4.5" fill="#58a6ff">
      <animate attributeName="cx" from="100" to="800" dur="5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cy="224" r="4.5" fill="#a371f7">
      <animate attributeName="cx" from="100" to="800" dur="5s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="224" r="4.5" fill="#3fb950">
      <animate attributeName="cx" from="100" to="800" dur="5s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pipeline nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="38" y="196" width="124" height="56" rx="10" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <text x="100" y="220" font-size="13" font-weight="700" fill="#e6edf3">SOURCES</text>
    <text x="100" y="238" font-size="10" fill="#8b949e">APIs · filings</text>

    <rect x="213" y="196" width="124" height="56" rx="10" fill="#0d1117" stroke="#017CEE" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="275" y="220" font-size="13" font-weight="700" fill="#e6edf3">AIRFLOW</text>
    <text x="275" y="238" font-size="10" fill="#8b949e">orchestrate</text>

    <rect x="388" y="196" width="124" height="56" rx="10" fill="#0d1117" stroke="#29B5E8" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="220" font-size="13" font-weight="700" fill="#e6edf3">SNOWFLAKE</text>
    <text x="450" y="238" font-size="10" fill="#8b949e">model · store</text>

    <rect x="563" y="196" width="124" height="56" rx="10" fill="#0d1117" stroke="#a371f7" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <text x="625" y="220" font-size="13" font-weight="700" fill="#e6edf3">LANGGRAPH</text>
    <text x="625" y="238" font-size="10" fill="#8b949e">agents</text>

    <rect x="738" y="196" width="124" height="56" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="800" y="220" font-size="13" font-weight="700" fill="#e6edf3">FASTAPI</text>
    <text x="800" y="238" font-size="10" fill="#8b949e">serve</text>
  </g>
</svg>
